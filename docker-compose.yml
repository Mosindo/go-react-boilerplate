name: lueur

# Local development stack: PostgreSQL + API. The mobile app runs on the host (see README).
# Usage:
#   cp .env.example .env   (then set JWT_SECRET)
#   docker compose up --build
#   docker compose run --rm api ./seed      # optional demo profiles (never in production)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a strong random value (see .env.example)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:8081/reset-password?token={token}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "18080:8080"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
