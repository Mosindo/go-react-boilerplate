name: ember

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ember}
      POSTGRES_DB: ember
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember -d ember"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://ember:${POSTGRES_PASSWORD:-ember}@postgres:5432/ember?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random string of at least 32 characters}
      UPLOAD_DIR: /data/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "18080:8080"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
