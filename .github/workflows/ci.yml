name: CI

on:
  push:
  pull_request:

env:
  JWT_SECRET: ci-only-6f2b9d0c4e8a1f37b5d9c2e6a0f4b8d1

jobs:
  api:
    name: API (gofmt, vet, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test (unit + integration)
        env:
          DATABASE_URL_TEST: postgres://app:app@localhost:5432/app_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: go build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    name: Mobile (types, lint, format, tests, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Web build
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
        run: npm run build:web

  e2e:
    name: End-to-end (API smoke + web UI flow)
    runs-on: ubuntu-latest
    needs: [api, mobile]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        env:
          APP_ENV: development
          DATABASE_URL: postgres://app:app@localhost:5432/app?sslmode=disable
          ALLOWED_ORIGINS: http://localhost:8099
          UPLOAD_DIR: ${{ runner.temp }}/uploads
          PORT: "18080"
        run: |
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          nohup "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Build and serve web app
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
        run: |
          npm ci
          npm run build:web
          nohup python3 -m http.server 8099 --directory dist > /dev/null 2>&1 &
      - name: API smoke test
        working-directory: apps/mobile
        run: npm run e2e:smoke
      - name: Web UI flow (Playwright)
        working-directory: apps/mobile
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
          npm run e2e:web
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/mobile/e2e/.results
          if-no-files-found: ignore
      - name: API logs
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  docker:
    name: Docker image (/health)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t seren-api ./services/api
      - name: Run stack and check /health
        run: |
          set -euo pipefail
          docker network create seren-ci
          docker run -d --name pg --network seren-ci --network-alias postgres \
            -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app -e POSTGRES_DB=app postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U app -d app && break; sleep 1; done
          docker run -d --name api --network seren-ci -p 18081:8080 \
            -e DATABASE_URL="postgres://app:app@postgres:5432/app?sslmode=disable" \
            -e JWT_SECRET="$JWT_SECRET" seren-api
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health)" = "200" ]; then echo "Health OK"; exit 0; fi
            sleep 1
          done
          docker logs api; exit 1
