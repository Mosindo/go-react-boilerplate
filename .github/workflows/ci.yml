name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./... -race
      - run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build the web bundle
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Build and start the API
        working-directory: services/api
        run: |
          go build -o /tmp/alba-api ./cmd/api
          APP_ENV=development PORT=18080 UPLOAD_DIR=/tmp/uploads \
            DATABASE_URL="postgres://postgres:postgres@localhost:5432/app?sslmode=disable" \
            JWT_SECRET="$(openssl rand -hex 32)" ALLOWED_ORIGINS=http://localhost:8081 \
            nohup /tmp/alba-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18080/health && break; sleep 1; done
      - name: Build and serve the web app
        working-directory: apps/mobile
        run: |
          npm ci
          EXPO_PUBLIC_API_URL=http://localhost:18080 npm run build:web
          (cd dist && nohup python3 -m http.server 8081 > /tmp/web.log 2>&1 &)
      - name: API smoke test
        working-directory: apps/mobile
        run: npm run e2e:api
      - name: Browser journey (register to chat)
        working-directory: apps/mobile
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          npm run e2e:web
      - name: API log on failure
        if: failure()
        run: tail -n 100 /tmp/api.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t alba-api ./services/api
      - name: Verify the container reaches /health
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f alba-run alba-pg >/dev/null 2>&1 || true; docker network rm alba-net >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker network create alba-net >/dev/null
          docker run -d --name alba-pg --network alba-net --network-alias postgres \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16-alpine >/dev/null
          for i in $(seq 1 30); do docker exec alba-pg pg_isready -U postgres -d app >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name alba-run --network alba-net -p 18081:8080 \
            -e DATABASE_URL="postgres://postgres:postgres@postgres:5432/app?sslmode=disable" \
            -e JWT_SECRET="$(openssl rand -hex 32)" alba-api >/dev/null
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)" = "200" ] && exit 0
            sleep 1
          done
          docker logs alba-run || true
          exit 1
