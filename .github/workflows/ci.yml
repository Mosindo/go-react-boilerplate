name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ember
          POSTGRES_PASSWORD: ember
          POSTGRES_DB: ember_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ember -d ember_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://ember:ember@localhost:5432/ember_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - name: Bundle check
        run: npx expo export --platform android --output-dir /tmp/expo-out
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ember
          POSTGRES_PASSWORD: ember
          POSTGRES_DB: ember
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ember -d ember"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the API
        working-directory: services/api
        env:
          DATABASE_URL: postgres://ember:ember@localhost:5432/ember?sslmode=disable
          JWT_SECRET: ci-only-random-secret-0123456789abcdef
          PORT: "18080"
          UPLOAD_DIR: /tmp/uploads
        run: |
          go build -o /tmp/api ./cmd/api
          nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - name: Critical path against the running API
        working-directory: apps/mobile
        run: node scripts/e2e-api.mjs
        env:
          API_URL: http://localhost:18080

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ember-api ./services/api
