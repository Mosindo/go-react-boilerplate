name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Unit and integration tests
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/api && go build ./cmd/seed

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Web build
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  e2e:
    name: End-to-end (API + web)
    runs-on: ubuntu-latest
    needs: [api, mobile]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
      PORT: "18080"
      ALLOWED_ORIGINS: http://localhost:8081
      UPLOAD_DIR: /tmp/lueur-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API and seed demo data
        working-directory: services/api
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          go build -o /tmp/api ./cmd/api && go build -o /tmp/seed ./cmd/seed
          nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:18080/health && break; sleep 1; done
          /tmp/seed -count 8
      - name: Install web app and Playwright
        working-directory: apps/mobile
        run: |
          npm ci
          npm i -g playwright@1.49.1
          npx -y playwright@1.49.1 install --with-deps chromium
      - name: API smoke test
        working-directory: apps/mobile
        run: npm run e2e:smoke
        env:
          MOBILE_E2E_API_URL: http://localhost:18080
      - name: Web E2E (register -> match -> chat)
        working-directory: apps/mobile
        run: |
          npm run build:web
          NODE_PATH="$(npm root -g)" npm run e2e:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/mobile/e2e/.artifacts
            /tmp/api.log
          if-no-files-found: ignore
      - name: Docker image builds
        run: docker build -t lueur-api ./services/api
