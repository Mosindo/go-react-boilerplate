name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API (format, vet, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Unit and integration tests (race detector)
        run: go test -race -count=1 ./...
      - run: go build ./cmd/api && go build ./cmd/seed

  mobile:
    name: Mobile (typecheck, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  e2e:
    name: End-to-end (API smoke + web UI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_API_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
          JWT_SECRET: ci-e2e-secret-0123456789abcdef0123456789
          PORT: "18080"
          MEDIA_DIR: ${{ runner.temp }}/media
          ALLOWED_ORIGINS: http://localhost:8081
        run: |
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          nohup "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Install mobile dependencies and Chromium
        working-directory: apps/mobile
        run: npm ci && npx playwright install --with-deps chromium
      - name: API smoke test
        working-directory: apps/mobile
        run: npm run e2e:api
      - name: Web build and UI end-to-end test
        working-directory: apps/mobile
        run: EXPO_PUBLIC_API_URL="$E2E_API_URL" npm run build:web && npm run e2e:web
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/mobile/e2e/reports
          if-no-files-found: ignore
      - name: API logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  docker:
    name: Docker image (/health)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lueur-api ./services/api
      - name: Verify container health
        run: |
          set -euo pipefail
          trap 'docker rm -f lueur-api lueur-pg >/dev/null 2>&1 || true; docker network rm lueur-net >/dev/null 2>&1 || true' EXIT
          docker network create lueur-net >/dev/null
          docker run -d --name lueur-pg --network lueur-net --network-alias postgres \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16-alpine >/dev/null
          for i in $(seq 1 30); do docker exec lueur-pg pg_isready -U postgres -d app >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name lueur-api --network lueur-net -p 18081:8080 \
            -e DATABASE_URL="postgres://postgres:postgres@postgres:5432/app?sslmode=disable" \
            -e JWT_SECRET="ci-docker-secret-0123456789abcdef0123" lueur-api >/dev/null
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)" = "200" ]; then echo "Health OK"; exit 0; fi
            sleep 1
          done
          docker logs lueur-api; exit 1
