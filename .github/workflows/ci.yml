name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test (unit + integration against Postgres)
        run: go test ./... -count=1
      - name: go build
        run: go build -o /dev/null ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
      - name: Web build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        env:
          JWT_SECRET: ci-only-0123456789abcdef0123456789abcdef-not-a-real-secret
        run: docker compose up --build -d
      - name: Wait for /health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:18080/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 1
          done
          docker compose logs api
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: API smoke test (register -> profile -> photo -> match -> chat)
        working-directory: apps/mobile
        env:
          API_BASE_URL: http://localhost:18080
        run: node ./scripts/e2e-smoke.js
      - name: Logs on failure
        if: failure()
        run: docker compose logs api
      - name: Tear down
        if: always()
        run: docker compose down -v
