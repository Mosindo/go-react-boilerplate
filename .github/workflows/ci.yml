name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Build and start the API
        working-directory: services/api
        run: |
          go build -o /tmp/ember-api ./cmd/api
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/app?sslmode=disable" \
          JWT_SECRET="ci-jwt-secret-with-at-least-32-chars-0123" PORT=18080 UPLOAD_DIR=/tmp/uploads \
          ALLOWED_ORIGINS="http://localhost:19006" nohup /tmp/ember-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - name: Build the web app and install a browser
        working-directory: apps/mobile
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          EXPO_PUBLIC_API_URL=http://localhost:18080 npm run build:web
          nohup python3 -m http.server 19006 -d dist > /tmp/web.log 2>&1 &
          sleep 2
      - name: API smoke test
        working-directory: apps/mobile
        run: npm run e2e:api
      - name: Browser end-to-end journey
        working-directory: apps/mobile
        run: npm run e2e:web

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot the stack, then check /health
        run: |
          export JWT_SECRET="ci-jwt-secret-with-at-least-32-chars-0123"
          docker compose up --build -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18080/health; then exit 0; fi
            sleep 1
          done
          docker compose logs api
          exit 1
