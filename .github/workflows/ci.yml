name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API (format, vet, unit + integration tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Tests (unit + HTTP integration on Postgres, race detector)
        run: go test -race -count=1 ./...
      - run: go build ./cmd/api ./cmd/seed

  mobile:
    name: Mobile (typecheck, lint, format, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Web export (bundles the whole app)
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  e2e:
    name: E2E (API + web build + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        run: |
          go build -o /tmp/lueur-api ./cmd/api
          APP_ENV=test PORT=18080 UPLOAD_DIR=/tmp/uploads ALLOWED_ORIGINS=http://localhost:8081 \
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/app?sslmode=disable \
          JWT_SECRET="$(openssl rand -base64 48)" nohup /tmp/lueur-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:18080/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - name: Runtime smoke test
        run: ./scripts/smoke.sh http://localhost:18080
      - name: Build web app and run Playwright
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build:web
          npm run test:e2e
      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log || true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lueur-api ./services/api
