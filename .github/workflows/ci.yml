name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Unit + integration tests (race detector)
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/api && go build ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Export web + native bundles
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
        run: npx expo export --platform web --platform android --platform ios --output-dir dist --clear

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
      JWT_SECRET: ci-only-jwt-signing-key-9f8e7d6c5b4a39281706
      APP_ENV: test
      PORT: "18080"
      UPLOAD_DIR: ${{ runner.temp }}/uploads
      ALLOWED_ORIGINS: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        run: |
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          nohup "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:18080/health && break; sleep 1; done
      - name: API smoke test
        run: node scripts/smoke-api.mjs --api http://localhost:18080
      - name: Build and serve the web app
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx expo export --platform web --output-dir dist --clear
          nohup npx --yes serve@14.2.4 -s dist -l 8081 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8081 > /dev/null && break; sleep 1; done
      - name: Browser E2E (register → match → chat → delete)
        working-directory: apps/mobile
        env:
          E2E_API_URL: http://localhost:18080
          E2E_WEB_URL: http://localhost:8081
        run: npm run e2e:web
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/mobile/.e2e/screenshots
          if-no-files-found: ignore
      - name: API logs
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api]
    steps:
      - uses: actions/checkout@v4
      - name: Compose up
        env:
          JWT_SECRET: ci-only-jwt-signing-key-9f8e7d6c5b4a39281706
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do curl -fsS http://localhost:18080/health && break; sleep 1; done
      - name: Smoke test through Docker
        run: node scripts/smoke-api.mjs --api http://localhost:18080
      - name: Seed demo data
        run: docker compose exec -T api ./seed -count 4
      - name: Logs
        if: failure()
        run: docker compose logs api
      - name: Compose down
        if: always()
        run: docker compose down -v
