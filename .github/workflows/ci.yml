name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test (unit + integration against PostgreSQL)
        run: go test ./... -count=1
      - name: Build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit and component tests
        run: npm test -- --ci
      - name: Build web bundle
        run: npm run build

  e2e:
    needs: [api, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build API
        working-directory: services/api
        run: go build -o /tmp/api ./cmd/api
      - name: Build web app
        working-directory: apps/mobile
        run: |
          npm ci
          npm run build
      - name: Install browser
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run end-to-end scenario
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
          JWT_SECRET: ci-0123456789abcdef0123456789abcdef-ci
          PORT: "18080"
          ALLOWED_ORIGINS: http://localhost:8081
          AUTH_RATE_LIMIT: "1000"
        run: |
          /tmp/api > /tmp/api.log 2>&1 &
          python3 -m http.server 8081 --directory apps/mobile/dist > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:18080/health && break; sleep 1; done
          cd e2e && npm test
      - name: API log on failure
        if: failure()
        run: tail -n 100 /tmp/api.log || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lien-api ./services/api
      - name: Container reaches /health
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f lien-api-run lien-pg >/dev/null 2>&1 || true; docker network rm lien-net >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker network create lien-net >/dev/null
          docker run -d --name lien-pg --network lien-net --network-alias postgres \
            -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app -e POSTGRES_DB=app postgres:16-alpine >/dev/null
          for i in {1..30}; do docker exec lien-pg pg_isready -U app -d app >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name lien-api-run --network lien-net -p 18081:8080 \
            -e DATABASE_URL="postgres://app:app@postgres:5432/app?sslmode=disable" \
            -e JWT_SECRET="ci-0123456789abcdef0123456789abcdef-ci" lien-api >/dev/null
          for i in {1..30}; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)" = "200" ] && exit 0
            sleep 1
          done
          docker logs lien-api-run || true
          exit 1
