name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/e2e?sslmode=disable
      EXPO_PUBLIC_API_URL: http://localhost:18080
      CI: "true"
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t lueur-api ./services/api
      - name: Smoke test (/health)
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f lueur-api-run lueur-pg >/dev/null 2>&1 || true; docker network rm lueur-net >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker network create lueur-net >/dev/null
          docker run -d --name lueur-pg --network lueur-net --network-alias postgres \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16-alpine >/dev/null
          for i in {1..30}; do docker exec lueur-pg pg_isready -U postgres -d app >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name lueur-api-run --network lueur-net -p 18081:8080 \
            -e DATABASE_URL="postgres://postgres:postgres@postgres:5432/app?sslmode=disable" \
            -e JWT_SECRET="$(openssl rand -hex 32)" lueur-api >/dev/null
          for i in {1..30}; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)" = "200" ] && echo "Health OK" && exit 0
            sleep 1
          done
          docker logs lueur-api-run || true
          exit 1
