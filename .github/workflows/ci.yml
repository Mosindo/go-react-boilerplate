name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests are skipped silently without this variable: keep it set in CI.
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum

      - name: Install Go dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests (unit + integration)
        run: go test -count=1 ./...

      - name: Build the backend
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Bundle the app (Android)
        run: npx expo export --platform android --output-dir /tmp/alma-export
        env:
          CI: "1"
          EXPO_OFFLINE: "1"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-test ./services/api

      - name: Verify the full journey against the Docker stack
        shell: bash
        run: |
          set -euo pipefail
          export JWT_SECRET="ci-jwt-secret-32-chars-minimum-value"

          cleanup() { docker compose logs api || true; docker compose down -v >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker compose up --build -d

          echo "Waiting for /health=200..."
          for i in {1..60}; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:18080/health || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          [ "$code" = "200" ]

          echo "Running the API smoke test (sign up -> match -> chat -> delete)..."
          MOBILE_E2E_API_URL=http://localhost:18080 node apps/mobile/scripts/e2e-smoke.js
