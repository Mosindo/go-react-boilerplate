name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        working-directory: services/api
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        working-directory: services/api
        run: go vet ./...
      - name: go test (unit + integration against PostgreSQL)
        working-directory: services/api
        run: go test -count=1 ./...
      - name: go build
        working-directory: services/api
        run: go build ./cmd/api && go build ./cmd/seed
      - name: Docker image builds and serves /health
        shell: bash
        run: |
          set -euo pipefail
          docker build -t lueur-api ./services/api
          docker run -d --name api --network host \
            -e DATABASE_URL="$DATABASE_URL_TEST" \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e PORT=18081 lueur-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18081/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        run: |
          go build -o /tmp/api ./cmd/api
          APP_ENV=test PORT=18080 UPLOAD_DIR=/tmp/uploads \
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/app?sslmode=disable \
          JWT_SECRET="$(openssl rand -hex 32)" ALLOWED_ORIGINS=http://localhost:8081 \
          nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci && npx playwright install --with-deps chromium
      - name: API smoke (critical path)
        working-directory: apps/mobile
        run: MOBILE_E2E_API_URL=http://localhost:18080 npm run e2e:smoke
      - name: Web build
        working-directory: apps/mobile
        run: EXPO_PUBLIC_API_URL=http://localhost:18080 npm run build:web
      - name: UI end-to-end (Playwright)
        working-directory: apps/mobile
        run: CI=1 npx playwright test --trace off
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/mobile/playwright-report
      - name: API logs
        if: failure()
        run: cat /tmp/api.log
