name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Tests (unit + integration)
        env:
          DATABASE_URL_TEST: postgres://app:app@localhost:5432/app_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - name: Bundle (Android)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api]
    env:
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghijklmnop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the Docker stack
        run: |
          printf 'JWT_SECRET=%s\n' "$JWT_SECRET" > .env
          docker compose --env-file .env -f infra/docker-compose.yml up --build -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:18080/health && exit 0
            sleep 1
          done
          docker compose -f infra/docker-compose.yml logs api
          exit 1
      - name: Smoke test the critical journey
        run: API_URL=http://localhost:18080 node scripts/smoke.mjs
      - name: Dump API logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs api
