name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, mobile]
    env:
      JWT_SECRET: ci-only-8f3b1c9d4e7a2b6c5d0e9f8a7b6c5d4e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the stack
        run: docker compose -f infra/docker-compose.yml up --build -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose -f infra/docker-compose.yml logs api
          exit 1
      - name: API journey (register -> profile -> like -> match -> chat -> block)
        env:
          MOBILE_E2E_API_URL: http://localhost:18080
        run: node apps/mobile/scripts/e2e-smoke.js
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
