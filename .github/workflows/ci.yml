name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Unit + integration tests (race detector)
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/api && go build ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Web build
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
        run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/mobile/dist

  e2e:
    needs: [api, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/mobile/dist
      - name: Start API
        working-directory: services/api
        env:
          APP_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_e2e?sslmode=disable
          JWT_SECRET: ${{ github.run_id }}-ci-only-random-secret-value-0123456789
          UPLOAD_DIR: /tmp/uploads
          ALLOWED_ORIGINS: http://localhost:8081
          PORT: "18080"
        run: |
          go build -o /tmp/api ./cmd/api
          nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - name: Serve web build
        run: nohup python3 -m http.server 8081 --directory apps/mobile/dist > /tmp/web.log 2>&1 &
      - name: Install dependencies and Chromium
        working-directory: apps/mobile
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser E2E (register → onboarding → like → match → chat → delete)
        working-directory: apps/mobile
        run: npm run e2e:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: apps/mobile/e2e/output
      - name: API logs
        if: failure()
        run: cat /tmp/api.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lueur-api ./services/api
      - name: Boot with docker compose and check /health
        env:
          JWT_SECRET: ci-${{ github.run_id }}-docker-only-random-secret-0123456789
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          docker compose logs api; exit 1
