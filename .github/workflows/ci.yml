name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test (unit + integration)
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, mobile]
    env:
      JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef0123
      ALLOWED_ORIGINS: http://localhost:8099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start the stack (Docker)
        run: docker compose up --build -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs api
          exit 1
      - name: API smoke test
        run: node scripts/smoke.mjs http://localhost:18080
      - name: Build the web client
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
        run: |
          npm ci
          npx expo export --platform web
      - name: Browser end-to-end test
        working-directory: apps/mobile
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose logs api
      - name: Stop the stack
        if: always()
        run: docker compose down -v
