name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests (unit + integration)
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Boot the stack and smoke-test the journey
        env:
          JWT_SECRET: ci-jwt-secret-with-at-least-32-characters-0001
          API_HOST_PORT: "18080"
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --build -d
          for i in {1..60}; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/health || true)" = "200" ] && break
            sleep 1
          done
          curl -fsS http://localhost:18080/health
          docker compose exec -T api ./seed
          API_URL=http://localhost:18080 node scripts/smoke-api.js
      - name: API logs on failure
        if: failure()
        run: docker compose logs api
      - name: Shutdown
        if: always()
        run: docker compose down -v
