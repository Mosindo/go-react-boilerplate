name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (with race detector, integration tests against Postgres)
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit and UI tests
        run: npm test -- --ci
      - name: Bundle (Android)
        run: EXPO_PUBLIC_API_URL=http://localhost:18080 npx expo export --platform android --output-dir /tmp/export

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the stack
        run: |
          cat > .env <<EOF2
          POSTGRES_PASSWORD=ci-database-password
          JWT_SECRET=$(openssl rand -hex 32)
          EOF2
          docker compose up --build -d
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/health)" = "200" ] && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: API smoke test (register → match → realtime chat → deletion)
        run: node apps/mobile/scripts/e2e-smoke.js
        env:
          MOBILE_E2E_API_URL: http://localhost:18080
      - name: Logs on failure
        if: failure()
        run: docker compose logs api
