name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./cmd/... ./internal/server/... ./internal/testutil/... ./internal/platform/... ./internal/features/auth/... ./internal/features/profiles/... ./internal/features/photos/... ./internal/features/discovery/... ./internal/features/chat/... ./internal/features/notifications/... ./internal/features/safety/...
      - name: go test
        run: go test -count=1 ./cmd/... ./internal/server/... ./internal/platform/... ./internal/features/auth/... ./internal/features/profiles/... ./internal/features/photos/... ./internal/features/discovery/... ./internal/features/chat/... ./internal/features/notifications/... ./internal/features/safety/...
      - name: go build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings 0
      - run: npx prettier --check .
      - run: npx jest
      - name: Web export (build check)
        run: npx expo export --platform web --output-dir dist
        env:
          CI: "1"
          EXPO_PUBLIC_API_URL: http://localhost:18080

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        run: |
          go build -o /tmp/api ./cmd/api
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/app?sslmode=disable" \
          JWT_SECRET="$(openssl rand -hex 32)" PORT=18080 UPLOAD_DIR=/tmp/uploads GIN_MODE=release \
          ALLOWED_ORIGINS="http://localhost:8081" nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:18080/health && break; sleep 1; done
      - name: Build web app and run browser E2E
        working-directory: apps/mobile
        run: |
          npm ci
          npx playwright install --with-deps chromium
          CI=1 EXPO_PUBLIC_API_URL=http://localhost:18080 npx expo export --platform web --output-dir dist
          npm run e2e:smoke
          npx playwright test -c e2e/web/playwright.config.ts
      - name: API log on failure
        if: failure()
        run: tail -n 100 /tmp/api.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t api-test ./services/api
      - name: Verify container health
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f api-test-run postgres-test >/dev/null 2>&1 || true; docker network rm api-test-network >/dev/null 2>&1 || true' EXIT
          docker network create api-test-network >/dev/null
          docker run -d --name postgres-test --network api-test-network --network-alias postgres \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16-alpine >/dev/null
          for i in {1..30}; do docker exec postgres-test pg_isready -U postgres -d app >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name api-test-run --network api-test-network -p 18081:8080 \
            -e DATABASE_URL="postgres://postgres:postgres@postgres:5432/app?sslmode=disable" \
            -e JWT_SECRET="$(openssl rand -hex 32)" api-test >/dev/null
          for i in {1..30}; do
            [ "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)" = "200" ] && exit 0
            sleep 1
          done
          docker logs api-test-run
          exit 1
