name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The integration suite DROPs and recreates the public schema: use a throwaway DB.
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test (unit + integration)
        run: go test -count=1 ./...
      - name: go build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Web bundle builds
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot the stack, then check /health
        shell: bash
        env:
          JWT_SECRET: ci0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          docker compose up -d --build
          for i in {1..40}; do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/health || true)"
            [ "$code" = "200" ] && { echo "health ok"; docker compose down -v; exit 0; }
            sleep 2
          done
          docker compose logs api
          exit 1
