name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alma
          POSTGRES_PASSWORD: alma
          POSTGRES_DB: alma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alma -d alma_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://alma:alma@localhost:5432/alma_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Tests (race detector, real PostgreSQL)
        run: go test -race -count=1 ./...
      - run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alma
          POSTGRES_PASSWORD: alma
          POSTGRES_DB: alma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alma -d alma" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start the API
        working-directory: services/api
        env:
          DATABASE_URL: postgres://alma:alma@localhost:5432/alma?sslmode=disable
          JWT_SECRET: ci-only-secret-0f3a9c1d7b6e4a58b2c9d1e0f7a6b5c4
          UPLOAD_DIR: ${{ runner.temp }}/uploads
          ALLOWED_ORIGINS: http://localhost:8081
          PORT: "18080"
        run: |
          go build -o ${{ runner.temp }}/api ./cmd/api
          nohup ${{ runner.temp }}/api > ${{ runner.temp }}/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:18080/health && break || sleep 1; done
      - name: Build the web app and run the critical flow
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build:web
          npm run e2e:web
      - name: API log
        if: failure()
        run: cat ${{ runner.temp }}/api.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t alma-api ./services/api
      - name: Smoke test /health
        run: |
          docker network create alma-net
          docker run -d --name pg --network alma-net --network-alias postgres -e POSTGRES_USER=alma -e POSTGRES_PASSWORD=alma -e POSTGRES_DB=alma postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U alma -d alma && break || sleep 1; done
          docker run -d --name api --network alma-net -p 18081:8080 \
            -e DATABASE_URL="postgres://alma:alma@postgres:5432/alma?sslmode=disable" \
            -e JWT_SECRET="ci-only-secret-0f3a9c1d7b6e4a58b2c9d1e0f7a6b5c4" alma-api
          for i in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health)" = 200 ] && exit 0 || sleep 1; done
          docker logs api; exit 1
