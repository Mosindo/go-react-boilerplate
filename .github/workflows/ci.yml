name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lueur_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lueur_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/lueur_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test (unit + integration against Postgres)
        run: go test -count=1 ./...
      - name: go build
        run: go build ./cmd/api && go build ./cmd/seed
      - name: Docker image builds
        working-directory: .
        run: docker build -t lueur-api ./services/api

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npx jest --ci
      - name: Web build
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid

  e2e:
    needs: [api, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lueur
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lueur"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_API_URL: http://localhost:18080
      E2E_WEB_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        run: |
          go build -o /tmp/lueur-api ./cmd/api
          APP_ENV=test PORT=18080 UPLOAD_DIR=/tmp/uploads ALLOWED_ORIGINS=http://localhost:8081 \
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/lueur?sslmode=disable \
          JWT_SECRET="$(openssl rand -base64 48)" nohup /tmp/lueur-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - name: Install app and browser
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: API smoke test
        working-directory: apps/mobile
        run: node ./scripts/e2e-smoke.js
      - name: Web UI end-to-end test
        working-directory: apps/mobile
        run: |
          EXPO_PUBLIC_API_URL=http://localhost:18080 CI=1 nohup npx expo start --web --port 8081 > /tmp/expo.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://localhost:8081 > /dev/null && break; sleep 2; done
          node ./e2e/web/critical-flow.mjs
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/mobile/e2e/web/screenshots
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: cat /tmp/api.log /tmp/expo.log || true
