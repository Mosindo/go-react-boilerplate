name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://app:app@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/app?sslmode=disable
          JWT_SECRET: ci-only-random-secret-0123456789abcdef0123456789
          PORT: "18080"
          UPLOAD_DIR: ${{ runner.temp }}/uploads
          ALLOWED_ORIGINS: http://localhost:8081
        run: |
          go build -o ../../api-bin ./cmd/api
          (../../api-bin > ../../api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:18080/health && break; sleep 1; done
      - name: Build web app and run browser journey
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
          CI: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run export:web
          npm run e2e
      - if: failure()
        run: cat api.log || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compose up and check /health
        env:
          JWT_SECRET: ci-only-random-secret-0123456789abcdef0123456789
        run: |
          docker compose -f infra/docker-compose.yml up --build -d
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:18080/health)" = "200" ] && exit 0
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs api
          exit 1
