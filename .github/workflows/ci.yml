name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Unit and integration tests
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
        run: go test -count=1 ./...
      - name: Build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, format
        run: npm run check
      - name: Export web, Android and iOS bundles
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: |
          npx expo export --platform web --output-dir dist-web
          npx expo export --platform android --output-dir dist-android
          npx expo export --platform ios --output-dir dist-ios

  e2e:
    needs: [api, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies and Chromium
        working-directory: apps/mobile
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: API smoke + browser E2E
        run: ./scripts/e2e-local.sh
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/mobile/.e2e
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aimant-api ./services/api
      - name: Container health check
        run: |
          set -euo pipefail
          trap 'docker logs api || true; docker rm -f api pg >/dev/null 2>&1 || true; docker network rm aimant >/dev/null 2>&1 || true' EXIT
          docker network create aimant >/dev/null
          docker run -d --name pg --network aimant -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16-alpine >/dev/null
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres -d app >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name api --network aimant -p 18081:8080 \
            -e DATABASE_URL="postgres://postgres:postgres@pg:5432/app?sslmode=disable" \
            -e JWT_SECRET="$(head -c 48 /dev/urandom | base64 | tr -d '\n')" aimant-api >/dev/null
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18081/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 1
          done
          exit 1
