name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Tests (unit + integration, race detector)
        run: go test -race -count=1 ./...
      - run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api]
    env:
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:18080/health >/dev/null && exit 0
            sleep 1
          done
          docker compose logs api
          exit 1
      - name: Smoke test (register -> match -> chat)
        run: bash scripts/smoke-api.sh http://localhost:18080
      - name: Logs on failure
        if: failure()
        run: docker compose logs api
      - name: Stop
        if: always()
        run: docker compose down -v
