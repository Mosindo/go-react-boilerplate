name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Tests (unit + PostgreSQL integration)
        run: go test ./... -count=1
      - name: Build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Bundle check
        run: npx expo export --platform android --output-dir /tmp/expo-export

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters-ok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Start stack
        run: docker compose up --build -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:18080/health >/dev/null && exit 0
            sleep 1
          done
          docker compose logs api
          exit 1
      - name: Smoke test (register → profile → photo → match → chat)
        working-directory: apps/mobile
        run: EXPO_PUBLIC_API_URL=http://localhost:18080 node scripts/e2e-smoke.js
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
