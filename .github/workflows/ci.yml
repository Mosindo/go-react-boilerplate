name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test (integration tests use the Postgres service)
        run: go test -race ./...
      - name: go build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build web bundle
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t api-test ./services/api
      - name: Verify container health
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f api-test-run postgres-test >/dev/null 2>&1 || true; docker network rm api-test-network >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker network create api-test-network >/dev/null
          docker run -d --name postgres-test --network api-test-network --network-alias postgres \
            -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app -e POSTGRES_DB=app postgres:16-alpine >/dev/null
          for i in {1..30}; do docker exec postgres-test pg_isready -U app -d app >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name api-test-run --network api-test-network -p 18081:8080 \
            -e DATABASE_URL="postgresql://app:app@postgres:5432/app?sslmode=disable" \
            -e JWT_SECRET="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')" \
            api-test >/dev/null
          for i in {1..30}; do
            [ "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)" = "200" ] && { echo "Health OK"; exit 0; }
            sleep 1
          done
          docker logs api-test-run || true
          exit 1
