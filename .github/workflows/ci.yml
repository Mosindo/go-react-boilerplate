name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API (gofmt, vet, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Tests (unit + integration against Postgres)
        run: go test -count=1 ./...
      - run: go build ./cmd/api ./cmd/seed

  mobile:
    name: Mobile (types, lint, format, tests, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  e2e:
    name: End-to-end (API smoke + browser journey)
    needs: [api, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
          ALLOWED_ORIGINS: http://localhost:19006
          UPLOAD_DIR: ${{ runner.temp }}/uploads
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          nohup "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 1; done
      - name: Install, build and serve the web app
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build:web
          nohup python3 -m http.server 19006 --directory dist > "$RUNNER_TEMP/web.log" 2>&1 &
      - name: API smoke
        working-directory: apps/mobile
        env:
          E2E_API_URL: http://localhost:8080
        run: npm run e2e:api
      - name: Browser journey
        working-directory: apps/mobile
        env:
          E2E_API_URL: http://localhost:8080
          E2E_WEB_URL: http://localhost:19006
          E2E_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: npm run e2e:web
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/api.log
          if-no-files-found: ignore

  docker:
    name: Docker image + compose health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          docker compose up --build -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Shutdown
        if: always()
        run: docker compose down -v
