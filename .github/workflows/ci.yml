name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (gofmt, vet, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: Unit + integration tests (race detector)
        run: go test -race -p 1 -count=1 ./...
      - name: Build
        run: go build ./cmd/api && go build ./cmd/seed

  mobile:
    name: Mobile (typecheck, lint, format, tests, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  e2e:
    name: End-to-end (Docker image, API smoke, browser flow)
    runs-on: ubuntu-latest
    needs: [api, mobile]
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-only-jwt-key-0123456789abcdefghijklmnop
      ALLOWED_ORIGINS: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start stack (docker compose)
        run: docker compose up --build -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          docker compose logs api; exit 1
      - name: Install mobile deps and browser
        working-directory: apps/mobile
        run: npm ci && npx playwright install --with-deps chromium
      - name: API smoke test
        working-directory: apps/mobile
        run: npm run e2e:api
      - name: Browser E2E (register → onboarding → match → realtime chat → delete)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
          E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
        run: |
          npm run build:web
          npx --yes serve@14 dist -l 8081 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8081 >/dev/null && break; sleep 1; done
          npm run e2e:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
      - name: API logs on failure
        if: failure()
        run: docker compose logs api
      - name: Shutdown
        if: always()
        run: docker compose down -v
