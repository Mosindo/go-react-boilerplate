name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Unit and integration tests (race detector)
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/api && go build ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - name: Web build
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, mobile]
    env:
      JWT_SECRET: ci-only-jwt-secret-${{ github.run_id }}-0123456789abcdef
      ALLOWED_ORIGINS: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start PostgreSQL and the API (Docker Compose)
        run: docker compose up --build -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:18080/health && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Install mobile dependencies and browser
        working-directory: apps/mobile
        run: npm ci && npx playwright install --with-deps chromium
      - name: API smoke test
        working-directory: apps/mobile
        run: npm run e2e:smoke
        env:
          MOBILE_E2E_API_URL: http://localhost:18080
      - name: Build and serve the web app
        working-directory: apps/mobile
        run: |
          npm run build:web
          (cd dist && python3 -m http.server 8081 >/dev/null 2>&1 &)
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
      - name: UI end-to-end test (register -> match -> chat)
        working-directory: apps/mobile
        run: npm run e2e:web
        env:
          API_URL: http://localhost:18080
          WEB_URL: http://localhost:8081
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/mobile/e2e/.results
          if-no-files-found: ignore
      - name: API logs
        if: failure()
        run: docker compose logs api
      - name: Stop stack
        if: always()
        run: docker compose down -v
