name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Check formatting
        working-directory: services/api
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: services/api
        run: go vet ./...
      - name: Test (unit + integration)
        working-directory: services/api
        run: go test -count=1 ./...
      - name: Build
        working-directory: services/api
        run: go build ./cmd/api ./cmd/seed
      - name: Build Docker image
        run: docker build -t tandem-api ./services/api

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npx tsc --noEmit
        working-directory: apps/mobile
      - run: npm run lint
        working-directory: apps/mobile
      - run: npm run format:check
        working-directory: apps/mobile
      - run: npm test
        working-directory: apps/mobile

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start API
        working-directory: services/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
          JWT_SECRET: ci-0123456789abcdef0123456789abcdef-ci
          PORT: "18080"
          UPLOAD_DIR: ${{ runner.temp }}/uploads
        run: |
          go build -o ../../api-bin ./cmd/api
          (../../api-bin > ../../api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:18080/health && break; sleep 1; done
      - name: Critical-path E2E (register → match → chat)
        working-directory: apps/mobile
        run: API_URL=http://localhost:18080 npm run e2e:api
      - name: API log on failure
        if: failure()
        run: cat api.log
