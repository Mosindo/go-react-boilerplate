name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test (unit + integration against Postgres)
        run: go test -race ./...

      - name: go build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings 0
      - run: npm run format:check
      - run: npm test -- --ci
      - name: Web build
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  e2e:
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_URL: http://localhost:18080
      WEB_URL: http://localhost:8099
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Start the API
        working-directory: services/api
        run: |
          go build -o /tmp/api ./cmd/api
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/app?sslmode=disable" \
          JWT_SECRET="$(openssl rand -base64 48)" PORT=18080 ALLOWED_ORIGINS="$WEB_URL" \
            nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS "$API_URL/health" && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1

      - name: Build and serve the web app
        working-directory: apps/mobile
        run: |
          npm ci
          EXPO_PUBLIC_API_URL="$API_URL" npm run build:web
          nohup python3 -m http.server 8099 --directory dist > /tmp/web.log 2>&1 &
          sleep 2

      - name: API smoke test
        working-directory: apps/mobile
        run: npm run e2e:smoke

      - name: Browser E2E (register -> onboarding -> like -> match -> chat -> delete account)
        working-directory: apps/mobile
        run: |
          npx playwright-core install --with-deps chromium
          npm run e2e:web

      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t api-test ./services/api

      - name: Verify runtime (/health=200)
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f api-test-run postgres-test >/dev/null 2>&1 || true
            docker network rm api-test-network >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create api-test-network >/dev/null
          docker run -d --name postgres-test --network api-test-network --network-alias postgres \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16-alpine >/dev/null
          for i in {1..30}; do docker exec postgres-test pg_isready -U postgres -d app >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name api-test-run --network api-test-network -p 18081:8080 \
            -e DATABASE_URL="postgres://postgres:postgres@postgres:5432/app?sslmode=disable" \
            -e JWT_SECRET="$(openssl rand -base64 48)" -e PORT=8080 api-test >/dev/null
          for i in {1..30}; do
            [ "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)" = "200" ] && echo "Health OK." && exit 0
            sleep 1
          done
          docker logs api-test-run || true
          exit 1
