name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        working-directory: services/api
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: services/api
        run: go vet ./...
      - name: go test (unit + integration)
        working-directory: services/api
        run: go test -count=1 ./...
      - name: go build
        working-directory: services/api
        run: go build ./cmd/api

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install
        working-directory: apps/mobile
        run: npm ci
      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Lint
        working-directory: apps/mobile
        run: npm run lint
      - name: Format
        working-directory: apps/mobile
        run: npm run format:check
      - name: Unit and component tests
        working-directory: apps/mobile
        run: npm test -- --silent

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, mobile]
    env:
      JWT_SECRET: ci-jwt-secret-0123456789abcdefghijklmnopqrstuvwxyz
      ALLOWED_ORIGINS: http://localhost:19006
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start the stack
        run: docker compose up --build -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs api
          exit 1
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: API smoke test
        working-directory: apps/mobile
        run: SMOKE_API_URL=http://localhost:18080 npm run e2e:smoke
      - name: Install Chromium
        run: npx --yes playwright@1.49 install --with-deps chromium
      - name: Browser end-to-end test
        working-directory: apps/mobile
        run: E2E_API_URL=http://localhost:18080 npm run e2e:web
      - name: API logs on failure
        if: failure()
        run: docker compose logs api
      - name: Shutdown
        if: always()
        run: docker compose down -v
