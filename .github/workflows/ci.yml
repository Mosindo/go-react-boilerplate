name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://app:app@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test (unit + Postgres integration)
        run: go test -race ./...
      - name: go build
        run: go build ./cmd/api && go build ./cmd/seed

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Web build
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080

  e2e:
    needs: [api, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/app?sslmode=disable
          JWT_SECRET: ci-${{ github.run_id }}-0123456789abcdefghijklmnopqrst
          PORT: "18080"
          UPLOAD_DIR: /tmp/uploads
          ALLOWED_ORIGINS: http://localhost:8081
        run: |
          go build -o /tmp/api ./cmd/api
          nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - name: Install mobile dependencies and Playwright
        working-directory: apps/mobile
        run: |
          npm ci
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: API smoke
        working-directory: apps/mobile
        run: npm run e2e:smoke
        env:
          MOBILE_E2E_API_URL: http://localhost:18080
      - name: Web build + UI E2E (register -> profile -> discover -> like -> match -> chat)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
          E2E_API_URL: http://localhost:18080
        run: |
          npm run build:web
          npm run e2e:web
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/mobile/e2e/report
          if-no-files-found: ignore
      - name: API logs
        if: failure()
        run: cat /tmp/api.log || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-docker-0123456789abcdefghijklmnopqrstuv
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot the Docker stack, then seed demo data
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do curl -fsS http://localhost:18080/health && break; sleep 1; done
          curl -fsS http://localhost:18080/health
          docker compose exec -T api ./seed
      - name: API logs
        if: failure()
        run: docker compose logs api
      - name: Shutdown
        if: always()
        run: docker compose down -v
