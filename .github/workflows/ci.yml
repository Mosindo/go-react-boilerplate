name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Unit + integration tests (race detector)
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/api ./cmd/seed

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Run API and smoke test the critical flow
        working-directory: services/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
          JWT_SECRET: ci-0f8d3c1b7a9e4f6d8b2a5c7e9f1a3b5d
          PORT: "18080"
        run: |
          go build -o /tmp/api ./cmd/api
          /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18080/health && break; sleep 1; done
          API_URL=http://localhost:18080 node ../../scripts/smoke-api.mjs || { cat /tmp/api.log; exit 1; }

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compose stack answers /health
        env:
          JWT_SECRET: ci-0f8d3c1b7a9e4f6d8b2a5c7e9f1a3b5d
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do curl -fsS http://localhost:18080/health && exit 0; sleep 1; done
          docker compose logs api
          exit 1
