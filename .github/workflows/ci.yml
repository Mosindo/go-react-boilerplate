name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (format, vet, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Unit and integration tests
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/api ./cmd/seed

  mobile:
    name: Mobile (types, lint, format, tests, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Web build
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
        run: npm run build:web

  e2e:
    name: End-to-end (API + web UI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start API
        working-directory: services/api
        run: |
          go build -o /tmp/api ./cmd/api
          APP_ENV=test PORT=18080 UPLOAD_DIR=/tmp/uploads ALLOWED_ORIGINS=http://localhost:8081 \
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/app?sslmode=disable \
          JWT_SECRET="$(openssl rand -hex 32)" nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18080/health && break; sleep 1; done
      - name: Build and serve the web app
        working-directory: apps/mobile
        run: |
          npm ci
          EXPO_PUBLIC_API_URL=http://localhost:18080 npm run build:web
          nohup python3 -m http.server 8081 --directory dist > /tmp/web.log 2>&1 &
      - name: Install Playwright
        working-directory: apps/mobile
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: API end-to-end
        working-directory: apps/mobile
        run: npm run e2e:api
      - name: Web UI end-to-end
        working-directory: apps/mobile
        env:
          E2E_SCREENSHOTS: /tmp/e2e-screenshots
        run: npm run e2e:web
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            /tmp/e2e-screenshots
            /tmp/api.log
          if-no-files-found: ignore

  docker:
    name: Docker image health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lueur-api ./services/api
      - name: Run with PostgreSQL and probe /health
        run: |
          set -euo pipefail
          docker network create lueur
          docker run -d --name pg --network lueur -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres -d app && break; sleep 1; done
          docker run -d --name api --network lueur -p 18081:8080 \
            -e DATABASE_URL=postgres://postgres:postgres@pg:5432/app?sslmode=disable \
            -e JWT_SECRET="$(openssl rand -hex 32)" lueur-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18081/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
