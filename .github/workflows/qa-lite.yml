name: QA Lite

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  qa-lite:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret-32-chars-minimum-value
      APP_BASE_URL: http://localhost:18080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Docker stack
        shell: bash
        run: docker compose up --build -d

      - name: Wait API health
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:18080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API healthcheck timeout"
          docker compose logs api || true
          exit 1

      - name: API smoke journey (register -> profile -> match -> chat)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
        run: node ./scripts/e2e-smoke.js

      - name: API logs on failure
        if: failure()
        shell: bash
        run: docker compose logs api || true

      - name: Shutdown Docker stack
        if: always()
        shell: bash
        run: docker compose down -v
