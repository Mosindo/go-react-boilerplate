name: E2E

# Real-browser run of the critical path (signup → onboarding → discover → like → match → chat →
# account deletion) against the Docker stack.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: ci-jwt-secret-32-chars-minimum-value
      ALLOWED_ORIGINS: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aurore/package-lock.json
      - name: Start the stack and seed demo accounts
        run: |
          docker compose up --build -d --wait --wait-timeout 120
          docker compose run --rm api ./seed
      - name: Install app dependencies and browser
        working-directory: apps/aurore
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the web app
        working-directory: apps/aurore
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:18080
      - name: Run the critical path
        working-directory: apps/aurore
        run: npm run e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/aurore/e2e/artifacts
      - name: Logs on failure
        if: failure()
        run: docker compose logs api
