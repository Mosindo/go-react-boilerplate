name: QA Lite

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  qa-lite:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret-32-chars-minimum-value-0f3a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Start Docker stack
        run: docker compose up --build -d

      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:18080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API healthcheck timeout"
          docker compose logs api || true
          exit 1

      - name: API smoke test (register, profile, photo, match, chat, safety)
        run: MOBILE_E2E_API_URL=http://localhost:18080 node apps/mobile/scripts/e2e-smoke.js

      - name: API logs on failure
        if: failure()
        run: docker compose logs api || true

      - name: Shutdown Docker stack
        if: always()
        run: docker compose down -v
