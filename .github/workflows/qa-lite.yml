name: QA Lite

on:
  workflow_dispatch:

# Manual quick check: API smoke test (register -> match -> chat) against a throwaway Postgres.
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run API and smoke test
        run: |
          cd services/api && go build -o /tmp/api ./cmd/api
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/app?sslmode=disable" JWT_SECRET="$(openssl rand -hex 32)" \
          PORT=18080 UPLOAD_DIR=/tmp/uploads nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:18080/health && break; sleep 1; done
          cd ../../apps/mobile && node scripts/e2e-smoke.js
