name: QA Lite

on:
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-0123456789abcdef0123456789abcdef-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - run: docker compose up --build -d
      - name: Wait for API
        run: |
          for i in {1..60}; do curl -fsS http://localhost:18080/health >/dev/null && exit 0; sleep 1; done
          docker compose logs api; exit 1
      - name: Smoke test
        working-directory: apps/mobile
        env:
          API_BASE_URL: http://localhost:18080
        run: node ./scripts/e2e-smoke.js
      - if: always()
        run: docker compose down -v
