# Same stack as the root docker-compose.yml, with the build context relative to infra/.
name: aurore

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@postgres:5432/app?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
    ports:
      - "18080:8080"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
