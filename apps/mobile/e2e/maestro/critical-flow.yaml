appId: ${APP_ID}
name: Lien critical flow (login -> discover -> like -> match -> chat)
---
- launchApp:
    clearState: true

- assertVisible: Bon retour
- tapOn:
    id: input-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: input-password
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-submit

# Discovery: the seeded profile has already liked us, so liking back creates the match.
- assertVisible:
    id: screen-discover
- assertVisible: ${MATCH_NAME}
- tapOn:
    id: action-like

- assertVisible: C'est un match !
- tapOn:
    id: match-open-chat

# Conversation
- tapOn:
    id: message-input
- inputText: Salut, ravi de ce match !
- tapOn:
    id: send-message
- assertVisible: Salut, ravi de ce match !

# Other tabs render
- back
- tapOn:
    id: tab-chat
- assertVisible:
    id: screen-chat
- tapOn:
    id: tab-notifications
- assertVisible:
    id: screen-notifications
- tapOn:
    id: tab-profile
- assertVisible:
    id: screen-profile
