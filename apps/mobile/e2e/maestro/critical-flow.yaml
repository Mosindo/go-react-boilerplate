appId: ${APP_ID}
name: Amora critical flow (sign in → like → match → chat)
---
# Fixtures come from `npm run e2e:ui:setup`: the contact has already liked the primary member.
- launchApp:
    clearState: true

- assertVisible:
    id: auth-screen
- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit

- assertVisible:
    id: discover-screen
- assertVisible: ${CONTACT_NAME}, 30
- tapOn:
    id: discover-like
- assertVisible:
    id: match-modal
- tapOn:
    id: match-message

- tapOn:
    id: chat-input
- inputText: Hello from Maestro
- tapOn:
    id: chat-send
- assertVisible: Hello from Maestro
