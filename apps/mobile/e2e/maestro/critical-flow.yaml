# Critical path: register -> onboarding -> discover -> like -> match -> chat
#
# NOT RUN in the authoring environment: Maestro needs an Android emulator / iOS simulator
# or a device with the app installed (expo run:android / run:ios), which was unavailable.
#
# Preconditions (device/emulator + backend):
#   * API reachable from the device (EXPO_PUBLIC_API_URL baked into the build).
#   * A demo profile that is compatible with the account created below (woman interested in
#     men, born 1995, within range) and that has ALREADY liked it, so that liking back
#     produces a match. Any backend seed profile compatible with these preferences works
#     once it has liked the new account (otherwise the flow stops at the deck step).
#   * The device photo library contains at least one image; the system photo picker UI
#     differs per OS/version, so the picker step below is the most fragile one.
appId: app.liane.mobile
env:
  EMAIL: maestro+${RANDOM}@example.com
  PASSWORD: Maestro12345
---
- launchApp:
    clearState: true
- tapOn:
    id: login-register
- tapOn:
    id: register-email
- inputText: ${EMAIL}
- tapOn:
    id: register-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: register-submit

# Onboarding - step 1
- tapOn:
    id: basics-name
- inputText: Camille
- tapOn:
    id: basics-birth
- inputText: "12041995"
- hideKeyboard
- tapOn:
    id: basics-gender-woman
- tapOn:
    id: basics-submit

# Step 2 - preferences
- tapOn:
    id: pref-man
- tapOn:
    id: prefs-submit

# Step 3 - location: skip (no GPS permission dialog needed)
- tapOn:
    id: location-skip

# Step 4 - about
- tapOn:
    id: interest-travel
- tapOn:
    id: about-submit

# Step 5 - photo (system picker: adapt to your device)
- tapOn:
    id: photo-add
- tapOn:
    text: "Photos"
- tapOn:
    point: "25%,25%"
- assertVisible:
    id: photo-0
- tapOn:
    id: onboarding-finish

# Discover -> like -> match
- assertVisible:
    id: swipe-card
- tapOn:
    id: like
- assertVisible: "C'est un match !"
- tapOn:
    id: match-chat

# Chat
- tapOn:
    id: chat-input
- inputText: Bonjour !
- tapOn:
    id: chat-send
- assertVisible: "Bonjour !"
