# Native UI flow for Maestro (https://maestro.mobile.dev). Not executed in CI: it needs an emulator or device.
# Run with: maestro test -e APP_ID=host.exp.Exponent -e TEST_EMAIL=you@example.com -e TEST_PASSWORD=... e2e/maestro/critical-flow.yaml
# The browser equivalent of the full journey (two users, match, realtime chat) lives in e2e/web.
appId: ${APP_ID}
name: Lien - sign in and browse
---
- launchApp:
    clearState: true
- assertVisible: Connexion
- tapOn: Adresse e-mail
- inputText: ${TEST_EMAIL}
- tapOn: Mot de passe
- inputText: ${TEST_PASSWORD}
- tapOn: Se connecter
- assertVisible: Découvrir
- tapOn: Messages
- assertVisible: Messages
- tapOn: Moi
- assertVisible: Modifier mon profil
