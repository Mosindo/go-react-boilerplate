# Alba critical flow (best effort, run with `npm run e2e:ui:run` on Windows or `maestro test` elsewhere).
# Fixtures come from `npm run e2e:ui:setup`: a fully onboarded user ($TEST_EMAIL) and a nearby user
# ($CONTACT_NAME) who already liked them, so liking back creates a match.
appId: ${APP_ID}
name: Alba Critical Flow
---
- launchApp:
    clearState: true

# Welcome -> sign in
- assertVisible:
    id: welcome-screen
- tapOn:
    id: welcome-login-button
- tapOn:
    id: auth-email-input
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit-button

# Discover: like the person who already liked us -> match
- assertVisible:
    id: tab-discover
- extendedWaitUntil:
    visible:
      id: discover-like-button
    timeout: 20000
- tapOn:
    id: discover-like-button
- assertVisible:
    id: match-modal
- tapOn:
    id: match-say-hello

# Chat: send and see a message
- tapOn:
    id: message-input
- inputText: maestro says hello
- tapOn:
    id: send-button
- assertVisible: maestro says hello
- tapOn:
    id: chat-back

# Notifications
- tapOn:
    id: tab-notifications
- assertVisible:
    id: notifications-list

# Profile and sign out
- tapOn:
    id: tab-profile
- assertVisible:
    id: profile-screen
- assertVisible:
    id: profile-preview
- tapOn:
    id: profile-signout
- assertVisible:
    id: welcome-screen
