appId: ${APP_ID}
name: Aurore critical flow (native)
---
# Run `npm run e2e:ui:setup` first: it creates two onboarded accounts, and the primary
# account has already liked the contact, so liking back from the contact side is covered
# by the Playwright web flow. This native flow checks sign-in, discovery and messaging.
- launchApp:
    clearState: true

- assertVisible:
    id: auth-screen
- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit

- assertVisible:
    id: discover-screen
- assertVisible:
    id: like-button

- tapOn:
    id: tab-Messages
- assertVisible:
    id: messages-screen

- tapOn:
    id: tab-Notifications
- assertVisible:
    id: notifications-screen

- tapOn:
    id: tab-Me
- assertVisible:
    id: profile-screen
- tapOn:
    id: sign-out
- assertVisible:
    id: auth-screen
