# Lumen critical flow: register -> onboarding -> discover -> like -> (match) -> chat.
# Requires a running API and a device/emulator with at least one compatible profile available
# (run `npm run e2e:smoke` first or seed a user), plus a photo in the device gallery.
# Run: maestro test -e APP_ID=host.exp.exponent -e TEST_EMAIL=maestro1@test.invalid -e TEST_PASSWORD='Maestro-pass-1' e2e/maestro/critical-flow.yaml
appId: ${APP_ID}
name: Lumen critical flow
---
- launchApp:
    clearState: true

- assertVisible: Welcome back
- tapOn: Create an account
- tapOn: Email
- inputText: ${TEST_EMAIL}
- tapOn: Password
- inputText: ${TEST_PASSWORD}
- tapOn: Confirm password
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: Create account

# Onboarding
- assertVisible: Let's start with you
- tapOn: First name
- inputText: Maestro
- tapOn: Birth date (DD/MM/YYYY)
- inputText: 17051994
- hideKeyboard
- tapOn: Man
- tapOn: Continue
- tapOn: Women
- tapOn: Continue
- tapOn: City
- inputText: Lisbon
- hideKeyboard
- tapOn: Continue
- tapOn: Save and continue
- tapOn: Add a photo
- tapOn:
    text: ".*(jpg|jpeg|png|Photo).*"
    optional: true
- assertVisible: Finish and start meeting people
- tapOn: Finish and start meeting people

# Discover -> like -> matches
- assertVisible: Discover
- tapOn: Like
- tapOn: Matches
- assertVisible: Matches
