appId: ${APP_ID}
name: Cléo critical flow
---
# Prerequisite: `npm run e2e:ui:setup` seeded TEST_EMAIL (onboarded, matched with CONTACT_NAME).
- launchApp:
    clearState: true

# Login
- assertVisible:
    id: login-screen
- tapOn:
    id: auth-email-input
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit-button

# Discover tab is the landing screen
- assertVisible:
    id: tab-discover
- assertVisible:
    id: discover-screen

# Conversations: open the seeded match and answer
- tapOn:
    id: tab-matches
- assertVisible:
    id: matches-screen
- tapOn: ${CONTACT_NAME}
- assertVisible:
    id: chat-screen
- tapOn:
    id: chat-message-input
- inputText: Bonjour depuis Maestro
- tapOn:
    id: chat-send-button
- assertVisible: Bonjour depuis Maestro
- back

# Notifications
- tapOn:
    id: tab-notifications
- assertVisible:
    id: notifications-screen

# Profile and settings
- tapOn:
    id: tab-profile
- assertVisible:
    id: profile-screen
- tapOn:
    id: profile-privacy-link
- assertVisible:
    id: privacy-screen
- back
- tapOn:
    id: profile-logout-button
- tapOn:
    id: sheet-confirm
- assertVisible:
    id: login-screen
