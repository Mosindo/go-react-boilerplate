# Native critical flow (iOS/Android) with Maestro: https://maestro.mobile.dev
#   maestro test e2e/maestro/critical-flow.yaml -e APP_ID=host.exp.Exponent -e TEST_EMAIL=me_$(date +%s)@e2e.lueur.invalid
# The same journey runs headless (and in CI) with `npm run e2e:web`.
appId: ${APP_ID}
name: Lueur critical flow
---
- launchApp:
    clearState: true
- tapOn:
    id: welcome-register
- tapOn:
    id: register-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: register-password
- inputText: Password123
- tapOn:
    id: register-adult
- tapOn:
    id: register-submit
- tapOn:
    id: onboarding-firstname
- inputText: Malo
- tapOn:
    id: onboarding-birth-day
- inputText: "14"
- tapOn:
    id: onboarding-birth-month
- inputText: "02"
- tapOn:
    id: onboarding-birth-year
- inputText: "1993"
- tapOn: Homme
- tapOn:
    id: onboarding-next
- tapOn: Des femmes
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-skip-location
- tapOn:
    id: photo-add-0
# The system photo picker opens here: select a photo and confirm the crop.
- waitForAnimationToEnd
- assertVisible:
    id: photo-slot-0
- tapOn:
    id: onboarding-finish
- assertVisible:
    id: discover-like
- tapOn:
    id: discover-like
