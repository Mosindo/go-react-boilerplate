appId: ${APP_ID}
name: Lueur critical flow (sign in -> discover -> like -> match -> chat)
---
- launchApp:
    clearState: true

- tapOn:
    id: welcome-signin
- tapOn:
    id: signin-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: signin-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: signin-submit

- assertVisible:
    id: discover-screen
- assertVisible: ${CONTACT_NAME}.*
- tapOn:
    id: discover-like

- assertVisible:
    id: match-modal
- tapOn:
    id: match-message

- assertVisible:
    id: chat-screen
- tapOn:
    id: chat-input
- inputText: Bonjour depuis Maestro
- tapOn:
    id: chat-send
- assertVisible: Bonjour depuis Maestro

- back
- tapOn:
    id: tab-notifications
- assertVisible:
    id: notifications-screen
- tapOn:
    id: tab-me
- assertVisible:
    id: me-screen
