# Ember critical flow (best effort, not run in CI):
# register -> onboarding -> discover -> like -> match -> chat.
#
# Prerequisites
#   - API reachable at EXPO_PUBLIC_API_URL from the device / emulator.
#   - A seeded account that has already liked everyone (so the first like is a match).
#   - The emulator gallery contains at least one photo (used for the required profile photo).
#
# Run:
#   maestro test -e APP_ID=app.ember.mobile \
#     -e TEST_EMAIL=maestro+$(date +%s)@example.com -e TEST_PASSWORD=Passw0rd-maestro \
#     apps/mobile/e2e/maestro/critical-flow.yaml
appId: ${APP_ID}
name: Ember critical flow
---
- launchApp:
    clearState: true

# --- Welcome -> Register ---
- assertVisible: 'Créer un compte'
- tapOn:
    id: welcome-register
- tapOn:
    id: register-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: register-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: register-confirm
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: register-adult
- tapOn:
    id: register-submit

# --- Onboarding 1/6: identity ---
- assertVisible: 'Faisons connaissance'
- tapOn:
    id: first-name
- inputText: Maestro
- tapOn:
    id: birth-day
- inputText: '12'
- tapOn:
    id: birth-month
- inputText: '05'
- tapOn:
    id: birth-year
- inputText: '1994'
- hideKeyboard
- tapOn: 'Femme'
- tapOn:
    id: onboarding-next

# --- 2/6: preferences ---
- assertVisible: 'Qui souhaitez-vous rencontrer ?'
- tapOn: 'Des hommes'
- tapOn:
    id: onboarding-next

# --- 3/6: city ---
- assertVisible: 'Où êtes-vous ?'
- tapOn:
    id: city
- inputText: Lyon
- hideKeyboard
- tapOn:
    id: onboarding-next

# --- 4/6: bio, 5/6: interests ---
- assertVisible: 'Parlez de vous'
- tapOn:
    id: bio
- inputText: Profil de test automatisé.
- hideKeyboard
- tapOn:
    id: onboarding-next
- assertVisible: 'Vos centres d’intérêt'
- tapOn:
    id: onboarding-next

# --- 6/6: photos (first gallery picture) ---
- assertVisible: 'Vos plus belles photos'
- tapOn:
    id: photo-add
- tapOn:
    point: 25%,25%
- assertVisible: 'Photo ajoutée.'
- tapOn:
    id: onboarding-finish

# --- Discover: like -> match -> chat ---
- assertVisible: 'Découvrir'
- tapOn:
    id: discover-like
- assertVisible: "C'est un match !"
- tapOn:
    id: match-open-chat
- tapOn:
    id: chat-input
- inputText: Bonjour depuis Maestro
- tapOn:
    id: chat-send
- assertVisible: 'Bonjour depuis Maestro'
