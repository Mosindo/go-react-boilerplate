appId: ${APP_ID}
name: Lumen critical flow (existing complete profile)
# Requires a user with a complete profile and at least one candidate in discovery.
# Provision with the seed command in the root README, then pass TEST_EMAIL / TEST_PASSWORD.
---
- launchApp:
    clearState: true

- tapOn:
    id: welcome-login
- tapOn:
    id: auth-email-input
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit-button

- assertVisible:
    id: discover-screen
- tapOn:
    id: discover-like
- tapOn:
    id: tab-chats
- assertVisible:
    id: chats-screen
- tapOn:
    id: tab-profile
- assertVisible:
    id: profile-screen
- tapOn:
    id: row-signout
- tapOn: Sign out
- assertVisible:
    id: welcome-screen
