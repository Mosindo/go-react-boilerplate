appId: ${APP_ID}
name: Alma critical flow - login, discover, like, match, chat
---
- launchApp:
    clearState: true

# --- Sign in (the account is already onboarded by `npm run e2e:ui:setup`) ---
- assertVisible:
    id: auth-screen
- tapOn:
    id: auth-email-input
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit-button

# --- Discover: the contact already liked us, so she is proposed first ---
- assertVisible:
    id: home-screen
- assertVisible: ${CONTACT_NAME}.*
- tapOn:
    id: discover-like

# --- Match celebration, then the first message ---
- assertVisible: C'est un match !
- tapOn:
    id: match-send-message
- tapOn:
    id: chat-message-input
- inputText: Ravi de vous rencontrer
- tapOn:
    id: chat-send-button
- assertVisible: Ravi de vous rencontrer

# --- The conversation is listed in the Matches tab ---
- back
- tapOn:
    id: tab-Matches
- assertVisible:
    id: matches-screen
- assertVisible: ${CONTACT_NAME}

# --- Privacy: the profile and settings are reachable ---
- tapOn:
    id: tab-Me
- assertVisible:
    id: profile-screen
