appId: ${APP_ID}
name: Lueur critical flow
---
# Prerequisite: `npm run e2e:ui:setup` creates an onboarded user who was already liked by CONTACT_NAME.
- launchApp:
    clearState: true

- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit

# Discovery: the admirer comes first; liking back creates the match.
- assertVisible:
    id: tab-Discover
- assertVisible:
    id: card-${CONTACT_NAME}
- tapOn:
    id: swipe-like
- assertVisible:
    id: match-modal
- tapOn:
    id: match-message

# Chat.
- tapOn:
    id: chat-input
- inputText: maestro ui ping
- tapOn:
    id: chat-send
- assertVisible: maestro ui ping
- tapOn:
    id: chat-back

# Messages, notifications, profile.
- tapOn:
    id: tab-Messages
- assertVisible:
    id: conversation-${CONTACT_NAME}
- tapOn:
    id: tab-Discover
- tapOn:
    id: open-notifications
- assertVisible:
    id: notifications-screen
