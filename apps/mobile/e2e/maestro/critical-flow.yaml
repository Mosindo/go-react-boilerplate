appId: ${APP_ID}
name: Lumen critical flow
---
# Fixtures come from `npm run e2e:ui:setup`: an onboarded member already matched with "Contact".
- launchApp:
    clearState: true

- tapOn:
    id: auth-email-input
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit-button

- assertVisible:
    id: discover-screen

- tapOn: Messages
- assertVisible:
    id: messages-screen
- tapOn: ${CONTACT_NAME}
- assertVisible: Bonjour depuis le setup E2E
- tapOn:
    id: chat-message-input
- inputText: Message envoyé par Maestro
- tapOn:
    id: chat-send-button
- assertVisible: Message envoyé par Maestro

- back
- tapOn: Notifications
- assertVisible:
    id: notifications-screen

- tapOn: Profil
- assertVisible:
    id: profile-screen
