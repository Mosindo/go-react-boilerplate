appId: ${APP_ID}
name: Lien critical flow (sign in -> discover -> like -> match -> chat)
---
- launchApp:
    clearState: true

- assertVisible:
    id: auth-screen
- tapOn:
    id: auth-email-input
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit-button

# Discovery shows the contact, who already liked us.
- assertVisible:
    id: home-screen
- assertVisible: ${CONTACT_NAME}.*
- tapOn:
    id: like-button

# Reciprocal like -> match celebration.
- assertVisible:
    id: match-modal
- tapOn:
    id: match-modal-message

# Conversation.
- assertVisible:
    id: chat-screen
- tapOn:
    id: chat-message-input
- inputText: Bonjour, ravi de ce match !
- tapOn:
    id: chat-send-button
- assertVisible: Bonjour, ravi de ce match !

# The conversation is listed.
- back
- tapOn:
    id: tab-messages
- assertVisible:
    id: matches-list
- assertVisible: ${CONTACT_NAME}

# Profile / settings are reachable.
- tapOn:
    id: tab-profile
- assertVisible:
    id: profile-screen
