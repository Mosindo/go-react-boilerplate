appId: ${APP_ID}
name: Lueur critical flow
---
# Prepared by `npm run e2e:ui:setup`: Alice is a complete member and Bob has already liked her.
- launchApp:
    clearState: true

- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit

# Discovery -> like -> match
- extendedWaitUntil:
    visible:
      id: swipe-like
    timeout: 20000
- tapOn:
    id: swipe-like
- assertVisible:
    id: match-modal
- tapOn:
    id: match-send-message

# Conversation
- tapOn:
    id: chat-input
- inputText: Bonjour depuis Maestro
- tapOn:
    id: chat-send
- assertVisible: Bonjour depuis Maestro
- tapOn:
    id: chat-back

# Other tabs
- tapOn:
    id: tab-messages
- assertVisible: ${CONTACT_NAME}
- tapOn:
    id: tab-notifications
- assertVisible: Nouveau match
- tapOn:
    id: tab-profile
- assertVisible: Mon profil
