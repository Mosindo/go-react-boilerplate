appId: ${APP_ID}
name: Lumen critical flow (register -> onboarding -> discover -> like -> chat)
---
- launchApp:
    clearState: true

# Registration
- tapOn: Create an account
- tapOn:
    id: auth-email-input
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit-button

# Onboarding: basics
- assertVisible:
    id: onboarding-title
- tapOn:
    id: onboarding-name
- inputText: Maestro
- tapOn:
    id: dob-day
- inputText: "12"
- tapOn:
    id: dob-month
- inputText: "4"
- tapOn:
    id: dob-year
- inputText: "1994"
- tapOn:
    id: gender-woman
- tapOn:
    id: onboarding-next

# Onboarding: who you want to meet
- tapOn:
    id: interested-man
- tapOn:
    id: onboarding-next

# Onboarding: location (city fallback)
- tapOn:
    id: onboarding-city
- inputText: Lyon
- tapOn:
    id: onboarding-next

# Onboarding: about you
- tapOn:
    id: bio-input
- inputText: Hello from the E2E suite
- tapOn:
    id: onboarding-next

# Onboarding: photos (requires a seeded photo in the simulator library)
- tapOn:
    id: photo-add-button
- tapOn:
    id: onboarding-next

# Discover -> like -> match -> chat (needs the seeded demo user who already liked this account)
- assertVisible:
    id: like-button
- tapOn:
    id: like-button
- tapOn:
    id: match-message-button
- tapOn:
    id: message-input
- inputText: Hi there!
- tapOn:
    id: message-send
- assertVisible: Hi there!
