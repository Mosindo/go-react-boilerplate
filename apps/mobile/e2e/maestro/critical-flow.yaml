appId: ${APP_ID}
name: Tendre critical flow (device)
---
# Fixtures come from `npm run e2e:ui:setup`: an onboarded user matched with a
# contact who already wrote. The verified browser journey lives in e2e/web.
- launchApp:
    clearState: true

- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-submit

- assertVisible:
    id: home-screen

- tapOn:
    id: tab-messages
- assertVisible:
    id: messages-screen
- assertVisible: Marc

- tapOn:
    id: tab-notifications
- assertVisible:
    id: notifications-screen
- assertVisible: ${NOTIFICATION_TITLE}

- tapOn:
    id: tab-profile
- assertVisible:
    id: profile-screen
